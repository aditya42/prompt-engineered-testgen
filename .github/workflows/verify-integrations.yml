name: Verify TestRail and Jira connections
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TESTRAIL_URL: https://testrailspersonal.testrail.io
      TESTRAIL_PROJECT_ID: "1"
      TESTRAIL_SECTION_ID: "1"
      JIRA_URL: https://dhendeaditya510.atlassian.net
      JIRA_PROJECT_KEY: KAN
      TESTRAIL_EMAIL: ${{ secrets.TESTRAIL_EMAIL }}
      TESTRAIL_API_KEY: ${{ secrets.TESTRAIL_API_KEY }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - name: Check required secrets
        shell: bash
        run: |
          for key in TESTRAIL_EMAIL TESTRAIL_API_KEY JIRA_EMAIL JIRA_API_TOKEN; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing required secret: $key"
              exit 1
            fi
          done
      - name: Verify API access independently
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request

          def request_json(url, username, secret):
              value = base64.b64encode(f"{username}:{secret}".encode()).decode()
              req = urllib.request.Request(url, headers={
                  "Authorization": "Basic " + value,
                  "Accept": "application/json",
                  "User-Agent": "prompt-testgen-verify/1.0",
              })
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return json.load(response), None
              except urllib.error.HTTPError as exc:
                  return None, f"HTTP {exc.code}"
              except urllib.error.URLError:
                  return None, "Network error"
              except (ValueError, KeyError, TypeError):
                  return None, "Invalid API response"

          results = {}
          tr = os.environ["TESTRAIL_URL"].rstrip("/")
          email, key = os.environ["TESTRAIL_EMAIL"], os.environ["TESTRAIL_API_KEY"]
          project, err = request_json(
              f"{tr}/index.php?/api/v2/get_project/{os.environ['TESTRAIL_PROJECT_ID']}", email, key)
          if err:
              results["TestRail"] = f"FAILED: project lookup {err}"
          elif not isinstance(project, dict) or str(project.get("id")) != os.environ["TESTRAIL_PROJECT_ID"]:
              results["TestRail"] = "FAILED: project ID mismatch"
          else:
              sections_response, err = request_json(
                  f"{tr}/index.php?/api/v2/get_sections/{os.environ['TESTRAIL_PROJECT_ID']}", email, key)
              if err:
                  results["TestRail"] = f"FAILED: section listing {err}"
              elif not isinstance(sections_response, (dict, list)):
                  results["TestRail"] = "FAILED: invalid section listing response"
              else:
                  sections = sections_response if isinstance(sections_response, list) else sections_response.get("sections", [])
                  section_id = os.environ["TESTRAIL_SECTION_ID"]
                  matching = [s for s in sections if isinstance(s, dict) and str(s.get("id")) == section_id]
                  if not matching:
                      results["TestRail"] = "FAILED: section not found in configured project"
                      print("Available section IDs:", [s.get("id") for s in sections[:30] if isinstance(s, dict)])
                  else:
                      results["TestRail"] = "PASS: project and section accessible"
                      print("TestRail verified section:", json.dumps({
                          "id": matching[0].get("id"), "name": matching[0].get("name")
                      }))

          jira = os.environ["JIRA_URL"].rstrip("/")
          email, key = os.environ["JIRA_EMAIL"], os.environ["JIRA_API_TOKEN"]
          me, err = request_json(f"{jira}/rest/api/3/myself", email, key)
          if err:
              results["Jira"] = f"FAILED: account lookup {err}"
          elif not isinstance(me, dict) or not me.get("accountId"):
              results["Jira"] = "FAILED: account response missing accountId"
          else:
              project, err = request_json(
                  f"{jira}/rest/api/3/project/{os.environ['JIRA_PROJECT_KEY']}", email, key)
              if err:
                  results["Jira"] = f"FAILED: project lookup {err}"
              elif not isinstance(project, dict) or project.get("key") != os.environ["JIRA_PROJECT_KEY"]:
                  results["Jira"] = "FAILED: project key mismatch"
              else:
                  results["Jira"] = "PASS: account and project accessible"

          print(json.dumps({"checks": results, "read_only": True, "writes_performed": 0}, indent=2))
          if not all(value.startswith("PASS") for value in results.values()):
              raise SystemExit(1)
          PY
