name: Code quality and offline tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    name: Python style and regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install ruff==0.14.3
      - name: Validate Python lint rules
        run: ruff check test_generation tests
      - name: Compile Python modules
        run: python -m compileall -q test_generation tests
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v

  playwright-smoke:
    name: Generate and execute synthetic Playwright test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Generate synthetic test
        run: python -m test_generation.runner generate --provider mock
      - name: Run Playwright smoke test
        run: npx playwright test
