name: BrowserStack Playwright - TestRail and Jira

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Preview or execute browser tests remotely"
        type: choice
        required: true
        default: preview
        options:
          - preview
          - full-demo
          - known-defect-demo
      provider:
        description: "Generate login test cases with OpenAI, or use offline mock"
        type: choice
        required: true
        default: openai
        options:
          - mock
          - openai

permissions:
  contents: read

concurrency:
  group: controlled-testrail-demo
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TESTRAIL_URL: https://testrailspersonal.testrail.io
      TESTRAIL_PROJECT_ID: "1"
      TESTRAIL_RETENTION_SCOPE: project
      TESTRAIL_SECTION_ID: "1"
      TESTRAIL_SUITE_ID: ${{ vars.TESTRAIL_SUITE_ID }}
      TESTRAIL_EMAIL: ${{ secrets.TESTRAIL_EMAIL }}
      TESTRAIL_API_KEY: ${{ secrets.TESTRAIL_API_KEY }}
      JIRA_URL: https://dhendeaditya510.atlassian.net
      JIRA_PROJECT_KEY: KAN
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEMO_ACTION: ${{ inputs.action }}
      KNOWN_DEFECT_DEMO: ${{ inputs.action == 'known-defect-demo' }}
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      SAUCEDEMO_BASE_URL: https://www.saucedemo.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests (offline, mocked APIs)
        run: python -m unittest discover -s tests -v
      - name: Verify TestRail and Jira read access
        run: python -m test_generation.runner verify
      - name: Prevent running the known training-defect demo with OpenAI
        if: inputs.action == 'known-defect-demo' && inputs.provider != 'mock'
        run: |
          echo "::error::Select provider=mock for known-defect-demo"
          exit 1
      - name: Verify BrowserStack and Jira configuration
        if: inputs.action != 'preview'
        run: |
          test -n "$BROWSERSTACK_USERNAME" || { echo "::error::Missing BROWSERSTACK_USERNAME secret"; exit 1; }
          test -n "$BROWSERSTACK_ACCESS_KEY" || { echo "::error::Missing BROWSERSTACK_ACCESS_KEY secret"; exit 1; }
          python -m test_generation.runner verify-jira-bug
      - name: Generate and preview case (no writes)
        if: inputs.action == 'preview'
        run: python -m test_generation.runner publish --provider ${{ inputs.provider }}
      - name: Publish login/cart cases and create TestRail run
        if: inputs.action != 'preview'
        run: |
          python -m test_generation.runner publish --apply --provider ${{ inputs.provider }}
          python -m test_generation.runner create-run --apply
      - name: Install BrowserStack Node SDK
        if: inputs.action != 'preview'
        run: npm install
      - name: Run Playwright on BrowserStack
        if: inputs.action != 'preview'
        continue-on-error: true
        run: npx browserstack-node-sdk playwright test
      - name: Synchronize TestRail results
        if: inputs.action != 'preview'
        run: python -m test_generation.runner sync --apply
      - name: Create Jira candidates for reproducible failures (label known demos)
        if: inputs.action != 'preview'
        run: python -m test_generation.runner sync --apply --create-bugs
      - name: Enforce Playwright quality gate after result publishing
        if: inputs.action != 'preview'
        run: python -m test_generation.runner quality-gate
      - name: Retain only the latest 3 TestRail runs in project 1
        if: ${{ always() && inputs.action != 'preview' }}
        run: |
          if [ -f state/run.json ]; then
            python -m test_generation.runner prune-runs --apply
          else
            echo "No new execution run to retain"
          fi
      - name: Publish GitHub Actions execution summary
        if: ${{ always() }}
        run: python -m test_generation.runner summary
      - name: Upload generated cases and run mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-generation-results-${{ github.run_id }}
          path: |
            state/
            reports/
            generated_tests/
          if-no-files-found: ignore
